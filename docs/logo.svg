<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Ring / Pool Accent Gradient -->
    <linearGradient id="poolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Balance Scale Beam Gradient -->
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect width="120" height="120" rx="28" fill="url(#bgGrad)" />
  <rect width="120" height="120" rx="28" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

  <!-- Ambient Light in Center -->
  <circle cx="60" cy="60" r="46" fill="url(#centerGlow)" />

  <!-- Orbiting Pool Nodes / Rings (Representing Account Pool) -->
  <!-- Outer Dashed Dynamic Ring -->
  <circle cx="60" cy="60" r="42" stroke="url(#poolGrad)" stroke-width="1.8" stroke-dasharray="6 4" stroke-opacity="0.4" />
  
  <!-- Subtle Orbital Trajectory -->
  <ellipse cx="60" cy="60" rx="42" ry="24" stroke="#818cf8" stroke-width="1.2" stroke-dasharray="3 3" stroke-opacity="0.3" transform="rotate(-20 60 60)" />

  <!-- Account Cluster Nodes (Key / Account representations) -->
  <circle cx="28" cy="40" r="3.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="92" cy="40" r="3.5" fill="#c084fc" filter="url(#glow)" />
  <circle cx="60" cy="18" r="3" fill="#818cf8" opacity="0.8" />
  <circle cx="60" cy="102" r="3" fill="#818cf8" opacity="0.6" />

  <!-- Central Balancer / Scale Core Structure -->
  <!-- Vertical Fulcrum Pillar -->
  <path d="M60 38 L60 84" stroke="url(#beamGrad)" stroke-width="3" stroke-linecap="round" />
  <!-- Pillar Base Stand -->
  <path d="M46 84 C52 82 68 82 74 84" stroke="url(#beamGrad)" stroke-width="3" stroke-linecap="round" />

  <!-- Dynamic Balance Beam (Horizontally balanced with slight geometric elegance) -->
  <path d="M34 50 Q60 46 86 50" stroke="url(#beamGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Central Pivot Point / Diamond Node -->
  <polygon points="60,43 65,48 60,53 55,48" fill="#ffffff" filter="url(#glow)" />

  <!-- Left Account Scale Pan / Pool Pod (Holding Accounts/Traffic) -->
  <path d="M34 50 L34 62" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8" />
  <path d="M22 64 C22 72 46 72 46 64 Z" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="2" stroke-linejoin="round" />
  <!-- Left Tokens/Energy -->
  <circle cx="30" cy="63" r="2" fill="#38bdf8" />
  <circle cx="38" cy="63" r="2" fill="#38bdf8" />

  <!-- Right Account Scale Pan / Pool Pod -->
  <path d="M86 50 L86 62" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.8" />
  <path d="M74 64 C74 72 98 72 98 64 Z" fill="rgba(192, 132, 252, 0.15)" stroke="#c084fc" stroke-width="2" stroke-linejoin="round" />
  <!-- Right Tokens/Energy -->
  <circle cx="82" cy="63" r="2" fill="#c084fc" />
  <circle cx="90" cy="63" r="2" fill="#c084fc" />
</svg>
